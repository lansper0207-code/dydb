    <style>

            <div id="header-content" class="flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span class="text-xs font-light tracking-widest text-white/90">导入对比模型</span>
            </div>
            <button id="fold-icon-wrapper" class="text-white/40 hover:text-white">
                <svg id="fold-svg" class="w-4 h-4 panel-transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>

        <div id="panel-body" class="p-3 flex flex-col gap-3 overflow-hidden opacity-100 transition-opacity duration-300">

    <!-- Camera / Hand Tracking Overlay -->

    <!-- Background Separation Line -->

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Wheel UI Config ---
        const R = 300;             
        const X_c = 420; // 放置在容器右侧以外，形成向左的弧线         
        const beta = 0.45;         
        
        function getWheelCenterY() {
            return window.innerHeight * 0.40; 
        }

        // --- Data Definitions ---
        const LEFT_MODEL = {
            name: "高句丽瓦当",
            path: "models/gaojuli.glb",
            color: 0x8a4b38 // 占位模型颜色：红/灰红陶
        };

        const RIGHT_MODELS = [
            { 
                name: "中原瓦当", path: "models/zhongyuan.glb", pinyin: "ZHONG YUAN WA DANG", color: 0x5a6b63, // 青灰陶
                desc: "<p><strong class='text-blue-400/90 font-medium'>形制：</strong>边轮相对较窄</p><p><strong class='text-blue-400/90 font-medium'>纹样：</strong>文字纹发达，云纹经典</p><p><strong class='text-blue-400/90 font-medium'>工艺：</strong>传统汉式烧制工艺</p><p class='text-xs text-gray-400 mt-2'>主要以青灰陶为主；西周至汉初半瓦当流行，东汉后全为圆瓦当；汉瓦当常见“长乐未央”“上林”等吉祥或宫苑文字，四神（青龙白虎朱雀玄武）构图对称规整；隋唐莲花纹更圆润、联珠纹常见，少高浮雕锐角。</p>" 
            },
            { 
                name: "渤海瓦当", path: "models/bohai.glb", pinyin: "BO HAI WA DANG", color: 0x6e5a4d,
                desc: "<p>渤海瓦当早期深受高句丽文化影响，采用“四分法”构图和忍冬纹等元素，后期逐渐接受唐风影响，形成了自己的风格。</p>" 
            },
            { 
                name: "百济新罗瓦当", path: "models/baiji.glb", pinyin: "BAI JI XIN LUO WA DANG", color: 0x7c6d59,
                desc: "<p>百济、新罗瓦当也受到高句丽文化的影响，在形制和纹样上有相似之处，但也各具特色，共同构成了东亚古代瓦当艺术的多元格局。</p>" 
            }
        ];

        const STATE = {
            currentIndex: -1, 
            leftTargetRotY: 0, leftTargetRotX: 0,
            leftCurrentRotY: 0, leftCurrentRotX: 0,
            rightTargetRotY: 0, rightTargetRotX: 0,
            rightCurrentRotY: 0, rightCurrentRotX: 0,
            wheelAngle: 0, targetWheelAngle: 0,
            isPanelFolded: false
        };

        // --- 3D Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance", alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 0); 
        container.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.0)); 
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.0); 
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);
        const backLight = new THREE.DirectionalLight(0xffffff, 1.0);
        backLight.position.set(-5, 5, -5);
        scene.add(backLight);

        // Post-processing
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
        bloomPass.threshold = 0.3; bloomPass.strength = 0.4; bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        // Model Groups
        const leftGroup = new THREE.Group();
        leftGroup.position.set(-2.2, 0, 0);
        scene.add(leftGroup);

        const rightGroup = new THREE.Group();
        rightGroup.position.set(2.2, 0, 0);
        scene.add(rightGroup);

        // Hitboxes for Raycasting (Invisible)
        const hitboxGeom = new THREE.SphereGeometry(1.6, 16, 16);
        const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
        const leftHitbox = new THREE.Mesh(hitboxGeom, hitboxMat);
        leftGroup.add(leftHitbox);
        const rightHitbox = new THREE.Mesh(hitboxGeom, hitboxMat);
        rightGroup.add(rightHitbox);

        // Loaders
        const gltfLoader = new GLTFLoader();

        // Fallback Mock Model Generator
        function createMockWadang(colorHex) {
            const group = new THREE.Group();
            // Main disc
            const geom = new THREE.CylinderGeometry(1.2, 1.2, 0.25, 64);
            geom.rotateX(Math.PI / 2);
            
            // Generate basic noise texture for bump
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#888'; ctx.fillRect(0,0,512,512);
            for(let i=0; i<50000; i++) {
                ctx.fillStyle = Math.random()>0.5?'#aaa':'#666';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);

            const mat = new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                roughness: 0.9, 
                bumpMap: tex,
                bumpScale: 0.05
            });
            const mesh = new THREE.Mesh(geom, mat);
            group.add(mesh);

            // Add center knob
            const knobGeom = new THREE.SphereGeometry(0.3, 32, 16, 0, Math.PI*2, 0, Math.PI/2);
            knobGeom.rotateX(Math.PI / 2);
            const knob = new THREE.Mesh(knobGeom, mat);
            knob.position.z = 0.125;
            group.add(knob);

            return group;
        }

        function loadModel(path, group, fallbackColor) {
            // Remove previous visible models (keep hitbox)
            for (let i = group.children.length - 1; i >= 0; i--) {
                if (group.children[i] !== leftHitbox && group.children[i] !== rightHitbox) {
                    group.remove(group.children[i]);
                }
            }

            // Attempt to load GLB. If fail (e.g. sandbox env), use fallback.
            gltfLoader.load(path, (gltf) => {
                const model = gltf.scene;
                // Center & Scale
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.4 / maxDim;
                model.scale.setScalar(scale);
                model.position.sub(center.multiplyScalar(scale));
                
                const wrapper = new THREE.Group();
                wrapper.add(model);
                group.add(wrapper);
            }, undefined, (error) => {
                console.warn(`[Mock Mode] Could not load ${path}, generating primitive placeholder.`, error);
                const mock = createMockWadang(fallbackColor);
                group.add(mock);
            });
        }

        // Init Fixed Left Model
        loadModel(LEFT_MODEL.path, leftGroup, LEFT_MODEL.color);

        // --- File Upload Logic ---
        window.toggleUploadPanel = function() {
            const panel = document.getElementById('upload-panel');
            const body = document.getElementById('panel-body');
            const headerText = document.getElementById('header-content');
            const foldSvg = document.getElementById('fold-svg');
            STATE.isPanelFolded = !STATE.isPanelFolded;
            if (STATE.isPanelFolded) {
                panel.style.width = '42px'; panel.style.height = '42px'; panel.style.borderRadius = '21px';
                body.style.opacity = '0'; headerText.style.opacity = '0';
                foldSvg.style.transform = 'rotate(-135deg) scale(1.2)'; foldSvg.style.color = '#60A5FA';
                setTimeout(() => { if(STATE.isPanelFolded) body.style.display = 'none'; }, 300);
            } else {
                panel.style.width = '224px'; panel.style.height = 'auto'; panel.style.borderRadius = '12px';
                body.style.display = 'flex';
                setTimeout(() => { body.style.opacity = '1'; headerText.style.opacity = '1'; }, 10);
                foldSvg.style.transform = 'rotate(0deg)'; foldSvg.style.color = '';
            }
        };

        const fileUpload = document.getElementById('file-upload');
        if (fileUpload) {
            fileUpload.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    files.forEach(file => {
                        const url = URL.createObjectURL(file);
                        RIGHT_MODELS.push({
                            name: file.name.replace(/\.[^/.]+$/, ""),
                            path: url,
                            pinyin: "CUSTOM MODEL",
                            color: 0x888888,
                            desc: "<p class='text-blue-400 font-light mt-2'>这是用户自定义导入的对比模型数据。</p>"
                        });
                    });
                    initWheelUI();
                    switchRightModelTo(RIGHT_MODELS.length - 1);
                }
            });
        }

        function updateFileListUI() {
            const countSpan = document.getElementById('file-count');
            const list = document.getElementById('file-list');
            if (!countSpan || !list) return;
            countSpan.innerText = `(${RIGHT_MODELS.length})`;
            list.innerHTML = '';
            RIGHT_MODELS.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = `px-3 py-1.5 rounded truncate transition-all duration-300 cursor-pointer hover:bg-white/5 ${index === STATE.currentIndex ? 'bg-blue-400/20 text-white border border-blue-400/30' : 'text-gray-400 border border-transparent'}`;
                li.innerText = file.name;
                li.addEventListener('click', () => {
                    switchRightModelTo(index);
                });
                list.appendChild(li);
            });
        }

        // --- Wheel & UI Logic ---
        function initWheelUI() {
            const container = document.getElementById('wheel-items');
            if (!container) return;
            container.innerHTML = '';

            RIGHT_MODELS.forEach((model, i) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'absolute pointer-events-auto cursor-pointer flex flex-row-reverse items-center gap-4 transition-all duration-300 select-none';
                itemDiv.id = `wheel-item-${i}`;
                
                itemDiv.innerHTML = `
                    <div class="relative flex items-center justify-center w-5 h-5">
                        <div class="absolute w-3 h-3 rounded-full border border-blue-400/30 transition-all duration-300" id="wheel-dot-outer-${i}"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-blue-400/50 transition-all duration-300" id="wheel-dot-${i}"></div>
                    </div>
                    <div class="flex flex-col text-right">
                        <span class="text-[15px] font-normal tracking-[0.16em] transition-all duration-300" id="wheel-text-${i}">${model.name}</span>
                        <span class="text-[9px] uppercase tracking-[0.22em] scale-90 origin-right opacity-0 transition-all duration-300" id="wheel-subtext-${i}">${model.pinyin}</span>
                    </div>
                `;
                
                itemDiv.addEventListener('click', () => {
                    switchRightModelTo(i);
                });
                container.appendChild(itemDiv);
            });
            setupWheelLayout();
        }

        function setupWheelLayout() {
            const centerY = getWheelCenterY(); 
            const arcTrack = document.getElementById('wheel-arc-track');
            const arcDash = document.getElementById('wheel-arc-dash');
            const focusPointer = document.getElementById('wheel-focus-pointer');
            const focusDot = document.getElementById('wheel-focus-dot');

            if (!arcTrack) return;

            // Compute arc on the left side of the circle (which is placed on the right)
            const startAngle = -1.0;
            const endAngle = 1.0;
            
            const x1 = X_c - R * Math.cos(startAngle);
            const y1 = centerY + R * Math.sin(startAngle);
            const x2 = X_c - R * Math.cos(endAngle);
            const y2 = centerY + R * Math.sin(endAngle);

            // Sweep flag 0 for inward curve on the right
            arcTrack.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 0 ${x2} ${y2}`);
            arcDash.setAttribute('d', `M ${x1 + 10} ${y1} A ${R - 10} ${R - 10} 0 0 0 ${x2 + 10} ${y2}`);

            const focusX = X_c - R;
            const focusY = centerY;
            focusPointer.setAttribute('x1', focusX - 15);
            focusPointer.setAttribute('y1', focusY);
            focusPointer.setAttribute('x2', focusX + 15);
            focusPointer.setAttribute('y2', focusY);
            focusPointer.setAttribute('stroke', '#60A5FA'); // Blue theme for right side

            focusDot.setAttribute('cx', focusX);
            focusDot.setAttribute('cy', focusY);
            focusDot.setAttribute('fill', '#60A5FA');
            focusDot.setAttribute('filter', 'drop-shadow(0 0 6px rgba(96, 165, 250, 0.8))');
            
            arcTrack.setAttribute('stroke', 'rgba(96, 165, 250, 0.15)');
            arcDash.setAttribute('stroke', 'rgba(96, 165, 250, 0.25)');
        }

        function initWheelInteractions() {
            const dragArea = document.getElementById('wheel-interactive-area');
            const selectorContainer = document.getElementById('wheel-selector-container');
            if (!dragArea) return;

            let isDraggingWheel = false;
            let dragStartY = 0;
            let dragStartWheelAngle = 0;

            dragArea.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                isDraggingWheel = true;
                dragArea.setPointerCapture(e.pointerId);

                dragStartY = e.clientY; 
                dragStartWheelAngle = STATE.targetWheelAngle;
            });

            dragArea.addEventListener('pointermove', (e) => {
                if (!isDraggingWheel) return;
                e.stopPropagation();

                let deltaY = e.clientY - dragStartY;
                let deltaAngle = deltaY * 0.004; 

                let targetAngle = dragStartWheelAngle + deltaAngle;

                const minClamp = -(RIGHT_MODELS.length - 1) * beta - 0.35;
                const maxClamp = 0 * beta + 0.35;
                STATE.targetWheelAngle = Math.max(minClamp, Math.min(targetAngle, maxClamp));
            });

            const endDrag = (e) => {
                if (!isDraggingWheel) return;
                isDraggingWheel = false;
                dragArea.releasePointerCapture(e.pointerId);

                const closestIndex = Math.max(0, Math.min(Math.round(-STATE.targetWheelAngle / beta), RIGHT_MODELS.length - 1));
                STATE.targetWheelAngle = -closestIndex * beta;

                if (closestIndex !== STATE.currentIndex) {
                    switchRightModelTo(closestIndex);
                }
            };

            dragArea.addEventListener('pointerup', endDrag);
            dragArea.addEventListener('pointercancel', endDrag);

            if (selectorContainer) {
                selectorContainer.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); 

                    const direction = Math.sign(e.deltaY);
                    let nextIndex = STATE.currentIndex + direction;
                    nextIndex = Math.max(0, Math.min(nextIndex, RIGHT_MODELS.length - 1));

                    if (nextIndex !== STATE.currentIndex) {
                        switchRightModelTo(nextIndex);
                    }
                }, { passive: false });
            }
        }

        function updateWheel() {
            STATE.wheelAngle = THREE.MathUtils.lerp(STATE.wheelAngle, STATE.targetWheelAngle, 0.25);

            const centerY = getWheelCenterY();
            
            RIGHT_MODELS.forEach((model, i) => {
                const itemDiv = document.getElementById(`wheel-item-${i}`);
                if (!itemDiv) return;

                const angle = i * beta + STATE.wheelAngle;
                const dotX = X_c - R * Math.cos(angle);
                const dotY = centerY + R * Math.sin(angle);

                itemDiv.style.transform = `translate(${dotX - 280}px, ${dotY - 18}px)`; // offset for container right alignment

                const distanceToFocus = Math.abs(angle);
                const maxProximityDist = 0.8;
                let factor = 1.0 - Math.min(distanceToFocus / maxProximityDist, 1.0);
                factor = Math.pow(factor, 2.0); 

                const dot = document.getElementById(`wheel-dot-${i}`);
                const dotOuter = document.getElementById(`wheel-dot-outer-${i}`);
                const text = document.getElementById(`wheel-text-${i}`);
                const subtext = document.getElementById(`wheel-subtext-${i}`);

                if (dot && text && subtext) {
                    const scale = 0.85 + factor * 0.45;    
                    const opacity = 0.22 + factor * 0.78;  
                    
                    text.style.transform = `scale(${scale})`;
                    text.style.transformOrigin = 'right center';
                    text.style.opacity = opacity;
                    
                    if (i === STATE.currentIndex) {
                        text.style.color = '#FFFFFF'; 
                        text.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.95), 0 0 20px rgba(96, 165, 250, 0.45)';
                        text.style.fontWeight = '500';
                        
                        dot.style.transform = 'scale(1.5)';
                        dot.style.backgroundColor = '#60A5FA';
                        if (dotOuter) {
                            dotOuter.style.transform = 'scale(2.0)';
                            dotOuter.style.borderColor = '#60A5FA';
                            dotOuter.style.boxShadow = '0 0 8px rgba(96, 165, 250, 0.6)';
                        }
                        
                        subtext.style.opacity = '1';
                        subtext.style.color = 'rgba(96, 165, 250, 0.8)';
                    } else {
                        text.style.color = 'rgba(255, 255, 255, 0.5)';
                        text.style.textShadow = 'none';
                        text.style.fontWeight = '300';
                        
                        dot.style.transform = 'scale(1.0)';
                        dot.style.backgroundColor = 'rgba(96, 165, 250, 0.3)';
                        if (dotOuter) {
                            dotOuter.style.transform = 'scale(1.0)';
                            dotOuter.style.borderColor = 'rgba(96, 165, 250, 0.3)';
                            dotOuter.style.boxShadow = 'none';
                        }
                        
                        subtext.style.opacity = '0';
                    }
                    
                    if (Math.abs(angle) > 1.25) {
                        itemDiv.style.display = 'none';
                    } else {
                        itemDiv.style.display = 'flex';
                    }
                }
            });
        }

        function switchRightModelTo(index) {
            STATE.currentIndex = index;
            STATE.targetWheelAngle = -index * beta;
            
            // Reset right rotation
            STATE.rightTargetRotY = 0;
            STATE.rightTargetRotX = 0;

            const modelData = RIGHT_MODELS[index];
            loadModel(modelData.path, rightGroup, modelData.color);

            // Update UI
            const panel = document.getElementById('right-ai-panel');
            panel.classList.remove('opacity-0', 'translate-y-8');
            
            document.getElementById('right-ai-title').innerText = modelData.name;
            document.getElementById('right-ai-pinyin').innerText = modelData.pinyin;
            document.getElementById('right-ai-text').innerHTML = modelData.desc;

            updateFileListUI();
        }

        // --- Interaction Logic (Mouse & Touch) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let draggedModel = null; // 'left' or 'right'
        let lastMousePos = { x: 0, y: 0 };

        container.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.glass-panel') || e.target.closest('button') || e.target.closest('#wheel-selector-container')) return;
            
            if (e.pointerType === 'touch') e.preventDefault();

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersectsLeft = raycaster.intersectObject(leftHitbox);
            const intersectsRight = raycaster.intersectObject(rightHitbox);

            if (intersectsLeft.length > 0) {
                draggedModel = 'left';
            } else if (intersectsRight.length > 0) {
                draggedModel = 'right';
            }

            lastMousePos = { x: e.clientX, y: e.clientY };
            container.setPointerCapture(e.pointerId);
        });

        container.addEventListener('pointermove', (e) => {
            if (!draggedModel) return;
            if (e.pointerType === 'touch') e.preventDefault();

            const dx = e.clientX - lastMousePos.x;
            const dy = e.clientY - lastMousePos.y;

            if (draggedModel === 'left') {
                STATE.leftTargetRotY += dx * 0.008;
                STATE.leftTargetRotX = Math.max(-Math.PI/2, Math.min(STATE.leftTargetRotX + dy * 0.008, Math.PI/2));
            } else if (draggedModel === 'right') {
                STATE.rightTargetRotY += dx * 0.008;
                STATE.rightTargetRotX = Math.max(-Math.PI/2, Math.min(STATE.rightTargetRotX + dy * 0.008, Math.PI/2));
            }

            lastMousePos = { x: e.clientX, y: e.clientY };
        });

        const endDrag = (e) => {
            draggedModel = null;
            container.releasePointerCapture(e.pointerId);
        };

        container.addEventListener('pointerup', endDrag);
        container.addEventListener('pointercancel', endDrag);

        // --- Hand Tracking (MediaPipe) ---
        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        
        hands.onResults((results) => {
            const canvas = document.getElementById('hands-canvas');
            const ctx = canvas.getContext('2d');
            ctx.save(); ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                document.getElementById('cam-status').className = 'w-1.5 h-1.5 rounded-full bg-green-500';
                
                let handsData = [];
                results.multiHandLandmarks.forEach(landmarks => {
                    drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#60A5FA', lineWidth: 2});
                    
                    // Canvas is mirrored via CSS, so x=0 visually is right side, x=1 is left side.
                    // We map visual x: 1.0 - x
                    const rawX = landmarks[9].x; // Middle finger MCP
                    const visualX = 1.0 - rawX;
                    
                    const pitch = (landmarks[9].y - landmarks[0].y) / Math.hypot(landmarks[9].x - landmarks[0].x, landmarks[9].y - landmarks[0].y);
                    
                    handsData.push({ x: visualX, pitch: pitch });
                });

                // Sort hands visually from left to right
                handsData.sort((a, b) => a.x - b.x);

                if (handsData.length === 1) {
                    // One hand: Sync rotation for both
                    const h = handsData[0];
                    const rotY = (h.x - 0.5) * Math.PI * 2.5;
                    const rotX = (h.pitch + 0.3) * Math.PI * 0.8;
                    
                    STATE.leftTargetRotY = rotY; STATE.leftTargetRotX = rotX;
                    STATE.rightTargetRotY = rotY; STATE.rightTargetRotX = rotX;
                } else if (handsData.length >= 2) {
                    // Two hands: Independent control
                    const leftH = handsData[0];
                    const rightH = handsData[1];
                    
                    STATE.leftTargetRotY = (leftH.x - 0.25) * Math.PI * 3.0;
                    STATE.leftTargetRotX = (leftH.pitch + 0.3) * Math.PI * 0.8;
                    
                    STATE.rightTargetRotY = (rightH.x - 0.75) * Math.PI * 3.0;
                    STATE.rightTargetRotX = (rightH.pitch + 0.3) * Math.PI * 0.8;
                }
            } else { 
                document.getElementById('cam-status').className = 'w-1.5 h-1.5 rounded-full bg-red-500'; 
            }
            ctx.restore();
        });

        document.getElementById('start-cam-overlay').addEventListener('click', () => {
            document.getElementById('start-cam-overlay').style.display = 'none';
            document.getElementById('hands-canvas').classList.remove('opacity-0');
            new Camera(document.getElementById('video-input'), { 
                onFrame: async () => await hands.send({image: document.getElementById('video-input')}), 
                width: 320, height: 180 
            }).start();
        });

        // --- Unity Comms ---
        window.addEventListener('message', function(event) {
            if (event.data === 'fromParent: i am ready') {
                console.log('对比系统准备就绪');
            }
        });

        document.getElementById('backToUnityBtn').addEventListener('click', function() {
            window.parent.postMessage('fromGesture: close me', '*');
        });

        // --- Init & Render Loop ---
        initWheelUI();
        initWheelInteractions();
        switchRightModelTo(0);
        updateFileListUI();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() / 1000;
            
            // Smoothly interpolate rotations
            STATE.leftCurrentRotY = THREE.MathUtils.lerp(STATE.leftCurrentRotY, STATE.leftTargetRotY, 0.15);
            STATE.leftCurrentRotX = THREE.MathUtils.lerp(STATE.leftCurrentRotX, STATE.leftTargetRotX, 0.15);
            
            STATE.rightCurrentRotY = THREE.MathUtils.lerp(STATE.rightCurrentRotY, STATE.rightTargetRotY, 0.15);
            STATE.rightCurrentRotX = THREE.MathUtils.lerp(STATE.rightCurrentRotX, STATE.rightTargetRotX, 0.15);
            
            // Apply rotations
            leftGroup.rotation.set(STATE.leftCurrentRotX, STATE.leftCurrentRotY, 0);
            rightGroup.rotation.set(STATE.rightCurrentRotX, STATE.rightCurrentRotY, 0);

            // Subtle floating effect
            leftGroup.position.y = Math.sin(time * 0.8) * 0.08;
            rightGroup.position.y = Math.sin(time * 0.8 + 1.5) * 0.08;

            updateWheel();
            composer.render();
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight); 
            composer.setSize(window.innerWidth, window.innerHeight);
            setupWheelLayout();
        });
    </script>
</body>
</html>
